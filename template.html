<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EXPO MAP">
<title>AICHI SKY EXPO 부스 검색 지도</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#e2e4e8;--txt:#1d2024;--sub:#6b7280;--acc:#e8590c;--hit:rgba(232,89,12,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#15171a;--panel:#1e2125;--line:#33373d;--txt:#e8eaed;--sub:#9aa0a8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans",sans-serif}
#app{display:grid;grid-template-columns:360px 1fr;height:100%}
#side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
#top{padding:12px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--txt)}
#chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--txt);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#count{color:var(--sub);font-size:12px;margin-top:6px}
#list{flex:1;overflow:auto;min-height:0}
.item{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.item:hover{background:var(--bg)}
.item.sel{background:var(--hit)}
.num{flex:none;min-width:42px;text-align:center;font-weight:700;border-radius:6px;padding:1px 0;color:#fff;font-size:13px}
.H-C{background:#c9a227}.H-D{background:#5d8a3a}.H-E{background:#2a9d8f}.H-F{background:#5b7fb5}
.nm{flex:1;min-width:0}
.nm b{font-weight:600;word-break:break-word}
.nm small{display:block;color:var(--sub);font-size:12px;word-break:break-word}
.star{flex:none;border:0;background:none;font-size:18px;color:var(--line);cursor:pointer;padding:0 2px}
.star.on{color:#f5b301}
#mapwrap{position:relative;overflow:hidden;touch-action:none;background:#fff;cursor:grab}
#mapwrap.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;width:2000px;height:1269px;transform-origin:0 0}
#stage img{display:block;width:2000px;height:1269px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hit{position:absolute;width:30px;height:20px;margin:-10px 0 0 -15px;border-radius:4px;cursor:pointer}
.hit:hover{background:var(--hit);outline:1px solid var(--acc)}
.hit.fav::after{content:"★";position:absolute;right:-4px;top:-9px;color:#f5b301;font-size:12px;text-shadow:0 0 2px #000}
#ring{position:absolute;pointer-events:none;display:none;width:60px;height:60px;margin:-30px 0 0 -30px;border:4px solid var(--acc);border-radius:50%;animation:pulse 1.1s infinite;transform-origin:center}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,89,12,.6)}100%{box-shadow:0 0 0 30px rgba(232,89,12,0)}}
#tip{position:absolute;display:none;transform-origin:0 100%;background:#1d2024;color:#fff;padding:6px 10px;border-radius:8px;max-width:280px;font-size:14px;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#tip b{color:#ffb380}
#ctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#ctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:20px;cursor:pointer}
#hint{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:8px;font-size:12px}
#srow{display:flex;gap:8px}
#srow #q{flex:1;min-width:0;width:auto}
#navbtn{flex:none;padding:0 12px;border-radius:10px;border:1px solid #1971ff;background:none;color:#1971ff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
#navbtn.on{background:#1971ff;color:#fff}
#route{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#me{position:absolute;display:none;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#1971ff;border:4px solid #fff;box-shadow:0 0 0 3px #1971ff,0 2px 8px rgba(0,0,0,.5);pointer-events:none}
#bar{position:absolute;left:10px;right:64px;bottom:10px;display:none;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#bar b{font-weight:700}
#bar button{border:1px solid #1971ff;background:#1971ff;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
#bar button.ghost{background:none;color:#1971ff}
#bar .msg{color:var(--sub)}
@media(max-width:800px){
 html,body{height:100dvh}
 #app{grid-template-columns:1fr;grid-template-rows:46dvh 1fr;height:100dvh}
 .item{padding:12px}
 .star{font-size:24px;padding:0 6px}
 #ctl button{width:44px;height:44px}
 #mapwrap{order:-1;border-bottom:1px solid var(--line)}
 #side{border-right:0}
 #hint{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div id="top">
      <div id="srow"><input id="q" type="search" placeholder="부스 번호 또는 업체명 (예: 321, UNIFLAME)" autocomplete="off"><button id="navbtn">🧭 길찾기</button></div>
      <div id="chips"></div>
      <div id="count"></div>
    </div>
    <div id="list"></div>
  </div>
  <div id="mapwrap">
    <div id="stage"><img src="data:image/jpeg;base64,IMG_B64" alt="map"><svg id="route" width="2000" height="1269"><polyline id="rl0" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"/><polyline id="rl1" fill="none" stroke="#1971ff" stroke-linecap="round" stroke-linejoin="round"/></svg><div id="me"></div><div id="ring"></div><div id="tip"></div></div>
    <div id="bar"></div>
    <div id="ctl"><button id="zi">＋</button><button id="zo">－</button><button id="zr" title="전체보기">⤢</button><button id="cl" title="선택 해제 (Esc)">✕</button></div>
    <div id="hint">드래그: 이동 · 휠/핀치: 확대 · 번호 클릭: 업체 확인</div>
  </div>
</div>
<script>
const DATA=/*DATA*/[];
const $=s=>document.querySelector(s);
const byN=Object.fromEntries(DATA.map(d=>[d.n,d]));
let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('expoFavs')||'[]'))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('expoFavs',JSON.stringify([...favs]))}catch(e){}};
let hall='ALL',sel=null,q='';

// ---- 정규화 (전각→반각, 소문자)
const norm=s=>s.normalize('NFKC').toLowerCase();
DATA.forEach(d=>d.key=norm(d.n+' '+d.t+' '+d.s.join(' ')+' '+d.g));

// ---- 지도 pan/zoom
const wrap=$('#mapwrap'),stage=$('#stage');
let sc=1,tx=0,ty=0;
const MAXS=3;
function fitScale(){return Math.min(wrap.clientWidth/2000,wrap.clientHeight/1269)}
function apply(){
  const f=fitScale();sc=Math.max(f*.9,Math.min(MAXS,sc));
  stage.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  stage.style.setProperty('--inv',1/sc);
  $('#ring').style.transform=`scale(${0.8/sc})`;
  $('#tip').style.transform=`scale(${1/sc})`;
  $('#me').style.transform=`scale(${0.7/sc})`;
  $('#rl0').style.strokeWidth=9/sc;$('#rl1').style.strokeWidth=5/sc;
}
function reset(){sc=fitScale();tx=(wrap.clientWidth-2000*sc)/2;ty=(wrap.clientHeight-1269*sc)/2;apply()}
function zoomAt(px,py,k){const ns=Math.max(fitScale()*.9,Math.min(MAXS,sc*k));k=ns/sc;tx=px-(px-tx)*k;ty=py-(py-ty)*k;sc=ns;apply()}
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15)},{passive:false});
const ptrs=new Map();let moved=0,pinch0=0;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('#ctl,#bar'))return;wrap.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;wrap.classList.add('drag');
  if(ptrs.size==2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1])}});
wrap.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size==1){tx+=e.clientX-p[0];ty+=e.clientY-p[1];moved+=Math.abs(e.clientX-p[0])+Math.abs(e.clientY-p[1]);apply()}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size==2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const r=wrap.getBoundingClientRect();
    zoomAt((a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,d/pinch0);pinch0=d;moved+=10}});
const up=e=>{
  // 포인터 캡처 때문에 click 이벤트 대상이 지도로 바뀌므로, 손가락/마우스를 뗀 위치로 직접 판정
  if(e.type==='pointerup'&&ptrs.size===1&&moved<6){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const h=el&&el.closest('.hit');
    if(h)select(h.dataset.n,{scroll:true,zoom:false});
    else if(el&&!el.closest('#ctl,#bar'))select(null);
  }
  ptrs.delete(e.pointerId);wrap.classList.remove('drag')};
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
$('#zi').onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1.4);
$('#zo').onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1/1.4);
$('#zr').onclick=()=>{saved=null;select(null);reset()};
$('#cl').onclick=()=>select(null);
addEventListener('keydown',e=>{if(e.key==='Escape')select(null)});
addEventListener('resize',()=>{if(!sel)reset();else apply()});

// ---- 지도 히트영역
const hits={};
DATA.forEach(d=>{const h=document.createElement('div');h.className='hit';h.style.left=d.x+'px';h.style.top=d.y+'px';
  h.dataset.n=d.n;hits[d.n]=h;stage.appendChild(h)});

let saved=null; // 선택 전 화면 상태 (해제 시 복원)
function select(n,o={}){
  if(n&&navMode===1){me=n;navMode=2;updateMe()}
  else if(n&&navMode===2&&n!==me)navMode=3;
  else if(!n&&navMode===3)navMode=2;
  if(n&&!sel&&!saved)saved={sc,tx,ty};
  sel=n;const ring=$('#ring'),tip=$('#tip');
  document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));
  if(!n){ring.style.display=tip.style.display='none';clearRoute();updateBar();
    if(saved){({sc,tx,ty}=saved);saved=null;apply()}return}
  const d=byN[n];
  ring.style.display='block';ring.style.left=d.x+'px';ring.style.top=d.y+'px';
  tip.style.display='block';tip.style.left=(d.x+14)+'px';tip.style.top=(d.y-14)+'px';tip.style.transformOrigin='0 100%';
  tip.innerHTML=`<b>${d.n}</b> ${esc(d.t)}`+(d.s.length?`<br><span style="opacity:.75;font-size:12px">${esc(d.s.slice(0,3).join(' '))}${d.s.length>3?' …':''}</span>`:'');
  const li=document.querySelector(`.item[data-n="${n}"]`);if(li){li.classList.add('sel');if(o.scroll)li.scrollIntoView({block:'nearest'})}
  if(o.zoom!==false){const target=Math.max(sc,Math.max(fitScale()*1.3,1.1));sc=Math.min(MAXS,Math.min(target,Math.max(sc,1.1)));tx=wrap.clientWidth/2-d.x*sc;ty=wrap.clientHeight/2-d.y*sc}
  else{ // 화면 밖이면 중앙으로
    const px=d.x*sc+tx,py=d.y*sc+ty;if(px<40||py<40||px>wrap.clientWidth-40||py>wrap.clientHeight-40){tx=wrap.clientWidth/2-d.x*sc;ty=wrap.clientHeight/2-d.y*sc}}
  apply();updateRoute();updateBar();
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- 목록
function render(){
  const terms=norm(q).split(/\s+/).filter(Boolean);
  const rows=DATA.filter(d=>(hall==='ALL'||(hall==='★'?favs.has(d.n):d.h===hall))&&terms.every(t=>d.key.includes(t)));
  $('#count').textContent=`${rows.length}개 부스`+(hall==='★'?' (즐겨찾기)':'');
  $('#list').innerHTML=rows.map(d=>`<div class="item${sel===d.n?' sel':''}" data-n="${d.n}"><span class="num H-${d.h}">${d.n}</span><div class="nm"><b>${esc(d.t)}</b>${d.s.length?`<small>${esc(d.s.join(' '))}</small>`:''}${d.g?`<small>[${esc(d.g)}]</small>`:''}</div><button class="star${favs.has(d.n)?' on':''}" data-s="${d.n}">★</button></div>`).join('');
  DATA.forEach(d=>hits[d.n].classList.toggle('fav',favs.has(d.n)));
}
$('#list').addEventListener('click',e=>{
  const s=e.target.closest('[data-s]');
  if(s){const n=s.dataset.s;favs.has(n)?favs.delete(n):favs.add(n);saveFavs();render();return}
  const it=e.target.closest('.item');if(it)select(it.dataset.n,{zoom:true});
});
$('#q').addEventListener('input',e=>{q=e.target.value;
  if(q.trim()&&hall!=='ALL'){hall='ALL';document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.h==='ALL'))}
  render();
  const t=norm(q).trim();if(/^\d{3}$/.test(t)&&byN[t])select(t,{zoom:true})});
$('#chips').innerHTML=['ALL','C','D','E','F','★'].map(h=>`<button class="chip${h==='ALL'?' on':''}" data-h="${h}">${h==='ALL'?'전체':h==='★'?'★ 즐겨찾기':'홀 '+h}</button>`).join('');
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;hall=b.dataset.h;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render()});
// ================= 길찾기 =================
const NAV=/*NAV*/null;
const CS=NAV.cs,GW=NAV.gw,GH=NAV.gh;
const grid=new Uint8Array(GW*GH);
{const bin=atob(NAV.b64);for(let i=0;i<GW*GH;i++)grid[i]=(bin.charCodeAt(i>>3)>>(7-(i&7)))&1}
// 벽에서 얼마나 떨어져 있는지 (통로 가운데로 길이 나게)
const dist=new Uint8Array(GW*GH);
for(let i=0;i<grid.length;i++)dist[i]=grid[i]?255:0;
for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;if(!dist[i])continue;let m=dist[i];
  if(x>0)m=Math.min(m,dist[i-1]+1);if(y>0){m=Math.min(m,dist[i-GW]+1);if(x>0)m=Math.min(m,dist[i-GW-1]+1);if(x<GW-1)m=Math.min(m,dist[i-GW+1]+1)}dist[i]=Math.min(m,255)}
for(let y=GH-1;y>=0;y--)for(let x=GW-1;x>=0;x--){const i=y*GW+x;if(!dist[i])continue;let m=dist[i];
  if(x<GW-1)m=Math.min(m,dist[i+1]+1);if(y<GH-1){m=Math.min(m,dist[i+GW]+1);if(x<GW-1)m=Math.min(m,dist[i+GW+1]+1);if(x>0)m=Math.min(m,dist[i+GW-1]+1)}dist[i]=Math.min(m,255)}

function nearestWalk(px,py){
  const cx=Math.floor(px/CS),cy=Math.floor(py/CS);let best=-1,bd=1e9;
  for(let r=0;r<80;r++){
    for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){
      if(Math.max(Math.abs(x-cx),Math.abs(y-cy))!==r||x<0||y<0||x>=GW||y>=GH)continue;
      if(!grid[y*GW+x])continue;const d=(x-cx)**2+(y-cy)**2;if(d<bd){bd=d;best=y*GW+x}}
    if(best>=0&&r>=Math.sqrt(bd)+1)break;
  }
  return best;
}
// 이진 힙 A*
function astar(s,t){
  const N=GW*GH,g=new Float32Array(N).fill(1e9),par=new Int32Array(N).fill(-1),done=new Uint8Array(N);
  const hx=[],hk=[];
  const push=(k,v)=>{let i=hk.length;hk.push(k);hx.push(v);while(i>0){const p=(i-1)>>1;if(hk[p]<=hk[i])break;[hk[p],hk[i]]=[hk[i],hk[p]];[hx[p],hx[i]]=[hx[i],hx[p]];i=p}};
  const pop=()=>{const v=hx[0],lk=hk.pop(),lv=hx.pop();if(hk.length){hk[0]=lk;hx[0]=lv;let i=0;for(;;){let l=2*i+1,r=l+1,m=i;if(l<hk.length&&hk[l]<hk[m])m=l;if(r<hk.length&&hk[r]<hk[m])m=r;if(m===i)break;[hk[m],hk[i]]=[hk[i],hk[m]];[hx[m],hx[i]]=[hx[i],hx[m]];i=m}}return v};
  const tx_=t%GW,ty_=(t/GW)|0;
  const h=i=>{const dx=Math.abs((i%GW)-tx_),dy=Math.abs(((i/GW)|0)-ty_);return Math.max(dx,dy)+0.414*Math.min(dx,dy)};
  g[s]=0;push(h(s),s);
  while(hk.length){
    const u=pop();if(done[u])continue;done[u]=1;if(u===t)break;
    const ux=u%GW,uy=(u/GW)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;const x=ux+dx,y=uy+dy;if(x<0||y<0||x>=GW||y>=GH)continue;
      const v=y*GW+x;if(!grid[v]||done[v])continue;
      if(dx&&dy&&(!grid[uy*GW+x]||!grid[y*GW+ux]))continue; // 모서리 파고들기 금지
      const w=(dx&&dy?1.414:1)*(1+0.8*Math.max(0,4-dist[v]));
      const ng=g[u]+w;if(ng<g[v]){g[v]=ng;par[v]=u;push(ng+h(v),v)}
    }
  }
  if(g[t]>=1e9)return null;
  const path=[];for(let i=t;i!==-1;i=par[i])path.push(i);return path.reverse();
}
function los(a,b){
  const ax=a%GW,ay=(a/GW)|0,bx=b%GW,by=(b/GW)|0,n=Math.max(Math.abs(bx-ax),Math.abs(by-ay));
  for(let i=1;i<n;i++){const x=Math.round(ax+(bx-ax)*i/n),y=Math.round(ay+(by-ay)*i/n);if(dist[y*GW+x]<2)return false}
  return true;
}
function smooth(p){
  const out=[p[0]];let i=0;
  while(i<p.length-1){let j=p.length-1;while(j>i+1&&!los(p[i],p[j]))j--;out.push(p[j]);i=j}
  return out;
}

// navMode: 0=꺼짐, 1=출발지 선택 대기, 2=도착지 선택 대기, 3=경로 표시 중
let me=null,navMode=0;
function setNav(m){navMode=m;if(m<2)me=null;if(m===0||m===1){clearRoute()}updateMe();updateBar();
  $('#navbtn').classList.toggle('on',m>0);$('#navbtn').textContent=m>0?'✕ 길찾기 종료':'🧭 길찾기'}
$('#navbtn').onclick=()=>{if(navMode){setNav(0)}else{const keep=sel;setNav(1);if(keep)select(null);}};
function updateMe(){const m=$('#me');if(!me){m.style.display='none';return}const d=byN[me];m.style.display='block';m.style.left=d.x+'px';m.style.top=d.y+'px'}
function clearRoute(){$('#rl0').setAttribute('points','');$('#rl1').setAttribute('points','');routeState=''}
let routeState='';
function updateRoute(){
  clearRoute();
  if(navMode!==3||!me||!sel||me===sel)return;
  const a=byN[me],b=byN[sel],s=nearestWalk(a.x,a.y),t=nearestWalk(b.x,b.y);
  const raw=s>=0&&t>=0?astar(s,t):null;
  if(!raw){routeState='fail';return}
  const pts=[[a.x,a.y],...smooth(raw).map(i=>[(i%GW)*CS+CS/2,((i/GW)|0)*CS+CS/2]),[b.x,b.y]];
  const str=pts.map(p=>p.join(',')).join(' ');
  $('#rl0').setAttribute('points',str);$('#rl1').setAttribute('points',str);
  routeState='ok';
  // 경로 전체가 보이도록 화면 맞춤
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),pad=90;
  const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  sc=Math.min(1.1,wrap.clientWidth/(x1-x0),wrap.clientHeight/(y1-y0));
  tx=wrap.clientWidth/2-(x0+x1)/2*sc;ty=wrap.clientHeight/2-(y0+y1)/2*sc;apply();
}
function updateBar(){
  const bar=$('#bar'),hint=$('#hint');
  if(!navMode){bar.style.display='none';hint.style.display='';return}
  hint.style.display='none';bar.style.display='flex';
  let h='';
  if(navMode===1)h=`<span>🧭 <b>출발지</b>를 선택하세요 <span class="msg">(왼쪽 목록이나 지도에서 부스 선택)</span></span>`;
  else if(navMode===2)h=`<span>📍 출발 <b>${me}</b> · <b>도착지</b>를 선택하세요</span><button class="ghost" data-a="start">출발지 변경</button>`;
  else h=`<span>📍 <b>${me}</b> → 🎯 <b>${sel}</b> ${routeState==='ok'?'경로 표시 중':'<span class="msg">경로를 찾지 못했어요</span>'}</span><button class="ghost" data-a="start">출발지 변경</button>`;
  bar.innerHTML=h;
}
$('#bar').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='start'){setNav(1);select(null)}});
updateMe();
reset();render();
</script>
