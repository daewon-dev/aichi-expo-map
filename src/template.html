<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#e2e4e8;--txt:#1d2024;--sub:#6b7280;--acc:#e8590c;--hit:rgba(232,89,12,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--panel:#1e2125;--line:#33373d;--txt:#e8eaed;--sub:#9aa0a8}}
:root[data-theme="dark"]{--bg:#15171a;--panel:#1e2125;--line:#33373d;--txt:#e8eaed;--sub:#9aa0a8}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans",sans-serif}
#app{display:grid;grid-template-columns:360px 1fr;height:100%}
#side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
#top{padding:12px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;font-size:16px;background:var(--bg);color:var(--txt)}
#chips{margin-top:8px}.crow{display:flex;gap:6px;flex-wrap:wrap}.crow{justify-content:center}.clbl{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px;font-weight:600;margin-bottom:6px}.clbl::before,.clbl::after{content:'';flex:1;border-top:1px solid #b6bbc3}.csep{border:0;border-top:1px solid #b6bbc3;margin:10px 0}.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.chip{border:1px solid var(--line);background:none;color:var(--txt);border-radius:3px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#count{color:var(--sub);font-size:12px;margin-top:6px}
#list{flex:1;overflow:auto;min-height:0}
.item{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.item:hover{background:var(--bg)}
.item.sel{background:var(--hit)}
.num{flex:none;min-width:42px;text-align:center;font-weight:700;border-radius:3px;padding:1px 0;color:#fff;font-size:13px}
.nm{flex:1;min-width:0}
.nm b{font-weight:600;word-break:break-word}
.nm small.desc{display:none}.item.sel:not(.shut) small.desc,#list.searching .item:not(.shut) small.desc{display:block;-webkit-line-clamp:unset}.more{color:var(--sub);font-size:11px;margin-left:6px}.item.sel:not(.shut) .more,#list.searching .item:not(.shut) .more{display:none}
.nm small{display:block;color:var(--sub);font-size:12px;word-break:break-word}
.star{flex:none;border:0;background:none;font-size:18px;color:var(--line);cursor:pointer;padding:0 2px}
.star.on{color:#f5b301}
#mapwrap{position:relative;overflow:hidden;touch-action:none;background:#fff;cursor:grab}
#mapwrap.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;width:__W__px;height:__H__px;transform-origin:0 0}
#stage img{display:block;width:__W__px;height:__H__px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hit{position:absolute;width:30px;height:20px;margin:-10px 0 0 -15px;border-radius:4px;cursor:pointer}
.hit:hover{background:var(--hit);outline:1px solid var(--acc)}
.hit{--k:max(1,min(var(--inv),4))} /* 확대하면 지도와 함께 커지고, 축소하면 최소 화면 크기를 유지 */
.hit.fav::after{content:"★";position:absolute;left:50%;bottom:calc(50% + 5px*var(--k));transform:translateX(-50%);line-height:1;color:#f5b301;font-size:calc(12px*var(--k));text-shadow:0 0 2px #000,0 0 2px #000}
#ring{position:absolute;pointer-events:none;display:none;width:60px;height:60px;margin:-30px 0 0 -30px;border:4px solid var(--acc);border-radius:50%;animation:pulse 1.1s infinite;transform-origin:center}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,89,12,.6)}100%{box-shadow:0 0 0 30px rgba(232,89,12,0)}}
#tip{position:absolute;display:none;transform-origin:0 100%;background:#1d2024;color:#fff;padding:6px 10px;border-radius:3px;max-width:280px;font-size:14px;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#tip b{font-weight:700}
#ctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#ctl button{width:38px;height:38px;border-radius:3px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:20px;cursor:pointer}
#hint{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:3px;font-size:12px}
#navpanel{display:none;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(25,113,255,.08)}
.ntitle{font-weight:700;color:#1971ff;font-size:16px;margin-bottom:8px}
.nslots{display:flex;align-items:stretch;gap:6px}
.nslots .arr{align-self:center;color:var(--sub)}
.slot{flex:1;min-width:0;text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--txt);border-radius:3px;padding:6px 9px;cursor:pointer;font-size:13px;line-height:1.35;overflow:hidden}
.slot small{display:block;color:var(--sub);font-size:11px}
.slot b{color:#1971ff;font-size:15px}
.slot span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.act{border-color:#1971ff;box-shadow:0 0 0 3px rgba(25,113,255,.28)}
.slot .ph{color:var(--sub)}
.nhelp{margin-top:6px;color:var(--sub);font-size:12px}
#meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
#meta #count{margin:0}
#langbtn,#themebtn,#addbtn{border:1px solid var(--line);background:none;color:var(--sub);border-radius:3px;padding:2px 12px;font-size:12px;cursor:pointer}
#srow{display:flex;gap:8px}
#srow #q{flex:1;min-width:0;width:auto}
#navbtn{flex:none;padding:0 12px;border-radius:3px;border:1px solid #1971ff;background:none;color:#1971ff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
#navbtn.on{background:#1971ff;color:#fff}
#route{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#me{position:absolute;display:none;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#1971ff;border:4px solid #fff;box-shadow:0 0 0 3px #1971ff,0 2px 8px rgba(0,0,0,.5);pointer-events:none}

#detail{display:none;padding:8px 12px;border-bottom:1px solid var(--line)}
.dhead{display:flex;align-items:center;gap:8px}

.dbtn{flex:none;border:1px solid var(--line);background:none;color:var(--sub);border-radius:3px;padding:3px 9px;font-size:13px;cursor:pointer;white-space:nowrap}

.item.vis{opacity:.5}
.chk{flex:none;border:0;background:none;font-size:18px;color:var(--line);cursor:pointer;padding:0 2px}
.chk.on{color:#2ea043}
.memoi{font-size:11px}
.hit.vis{background:rgba(17,24,39,.14);outline:2px solid #111827}
.hit.vis::before{content:"✓";position:absolute;left:50%;top:calc(50% + 5px*var(--k));transform:translateX(-50%);line-height:1;color:#fff;background:#111827;padding:.1em .3em;border-radius:3px;font-size:calc(11px*var(--k));font-weight:900}
.stopn{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#1971ff;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none;transform:scale(calc(var(--inv,1)*.8))}
.tlist{max-height:30dvh;overflow:auto;margin-top:6px}
.tstop{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;border-top:1px solid var(--line)}
.tstop .tn{flex:none;width:22px;height:22px;border-radius:50%;background:#1971ff;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.tstop .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tstop .chk{color:#2ea043;border:1px solid #2ea043;border-radius:3px;padding:2px 9px;font-size:14px}
.nbtn{margin-top:8px;border:1px solid #1971ff;background:#1971ff;color:#fff;border-radius:3px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}
.nbtn.ghost{background:none;color:#1971ff}
@media(max-width:800px){
 html,body{height:100dvh}
 #app{grid-template-columns:1fr;grid-template-rows:34dvh 1fr;height:100dvh}
 .item{padding:8px 4px 8px 12px;align-items:center}
 .nm small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .star,.chk{font-size:24px;min-width:44px;min-height:44px;padding:0}
 .chip{padding:8px 14px;font-size:14px}
 #langbtn,#themebtn,#addbtn{padding:8px 10px;font-size:13px}
 .dbtn{padding:9px 12px;font-size:14px}
 #bar button,.nbtn{min-height:40px}
 .tstop{padding:2px 0}.tstop .chk{min-width:44px;font-size:18px}
 #ctl button{width:44px;height:44px}
 #mapwrap{order:-1;border-bottom:1px solid var(--line)}
 #side{border-right:0}
 #hint{display:none}
 .navm #chips,.navm #meta,.navm #memo,.navm .webl{display:none}
}
.mb{display:flex;gap:6px}
#addmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center;padding:16px}#addmodal.on{display:flex}
.abox{background:var(--panel);color:var(--txt);border-radius:3px;padding:16px;max-width:380px;width:100%;max-height:90dvh;overflow:auto}.abox h3{margin:0 0 4px;font-size:17px}.abox h4{margin:14px 0 4px;font-size:14px;color:#1971ff}.abox ol{margin:0;padding-left:20px;line-height:1.75}.abox .an{color:var(--sub);font-size:12px;margin-top:12px}
#addx{margin-top:14px;width:100%;min-height:44px;border:1px solid #1971ff;background:#1971ff;color:#fff;border-radius:3px;font-size:15px;cursor:pointer}.nores{padding:18px 14px;text-align:center;color:var(--sub);font-size:14px;line-height:1.9}.nores a,.webl{color:#1971ff;text-decoration:none;font-weight:600}.webl{display:inline-block;margin-top:8px;font-size:13px}
</style>

<body>

<script>
const EVENT=/*EVENT*/{};
const MW=EVENT.w,MH=EVENT.h;
const DATA=/*DATA*/[];
{const st=document.createElement('style');st.textContent=EVENT.halls.map(h=>`.H-${h.id}{background:${h.color}}`).join('');document.head.appendChild(st)}
const $=s=>document.querySelector(s);
const I18N={
ko:{title:'',ph:'번호·업체명 검색 (예: 321)',nav:'🧭 길찾기',navEnd:'✕ 길찾기 종료',all:'전체',hall:'홀 ',hallLbl:'홀',fav:'★ 즐겨찾기',

  start:'출발',end:'도착',pick:'선택하세요',t1:'① 출발지를 선택하세요',t2:'② 도착지를 선택하세요',t3:'🧭 경로 표시 중',tfail:'경로를 찾지 못했어요',
  h12:'아래 목록이나 지도에서 부스를 누르세요',h3:'출발/도착 칸을 누르면 다시 고를 수 있어요',
  noname:'(업체명 없음)',guess:'(번호 누락 — 인접 목록으로 추정)',langBtn:'日本語',
  vis:'✓ 방문',countVis:' (방문)',visBtn:'✓ 방문함',memoPh:'메모 (예: 의자 살 것)',
  tourBtn:n=>`★ 즐겨찾기 ${n}곳 순회`,tourTitle:n=>`★ 순회 경로 · ${n}곳`,tourDone:n=>`✓ 방문 완료 ${n}곳`,
  tourAllDone:'남은 즐겨찾기를 모두 방문했어요 🎉',tourSkip:'갈 수 없어 제외: ',tourHelp:'✓를 누르면 방문 처리하고, 그 부스에서부터 다시 계산해요',tourBack:'← 도착지 선택으로',web:'🔎 웹에서 검색',toDark:'🌙 다크',toLight:'☀ 라이트',addBtn:'📲 앱 설치',addTitle:'홈 화면에 추가',close:'닫기',
  addIosH:'아이폰 / 아이패드 (Safari)',addIos:['Safari로 이 페이지를 열어요','화면 아래(아이패드는 위)의 공유 버튼 ⬆︎ 을 눌러요','「홈 화면에 추가」를 누르고 「추가」를 눌러요'],
  addAndH:'안드로이드 (Chrome)',addAnd:['Chrome으로 이 페이지를 열어요','오른쪽 위 ⋮ 메뉴를 눌러요','「앱 설치」 또는 「홈 화면에 추가」를 누르고 「설치」를 눌러요'],

ja:{title:'',ph:'番号・出展者名（例：321）',nav:'🧭 ルート案内',navEnd:'✕ ルート案内を終了',all:'すべて',hall:'ホール ',hallLbl:'ホール',fav:'★ お気に入り',
  count:n=>`${n}ブース`,countFav:'（お気に入り）',hint:'ドラッグ：移動 ・ ホイール/ピンチ：拡大 ・ 番号をタップ：出展者を確認',zr:'全体表示',cl:'選択解除（Esc）',
  start:'出発',end:'到着',pick:'選んでください',t1:'① 出発地を選んでください',t2:'② 目的地を選んでください',t3:'🧭 ルート表示中',tfail:'ルートが見つかりませんでした',
  h12:'下のリストまたは地図からブースをタップしてください',h3:'出発／到着の欄をタップすると選び直せます',
  noname:'（出展者名なし）',guess:'（番号欠落のため隣接リストから推定）',langBtn:'한국어',
  vis:'✓ 訪問済み',countVis:'（訪問済み）',visBtn:'✓ 訪問済み',memoPh:'メモ（例：椅子を買う）',
  tourBtn:n=>`★ お気に入り${n}件を巡回`,tourTitle:n=>`★ 巡回ルート ・ ${n}件`,tourDone:n=>`✓ 訪問済み ${n}件`,
  tourAllDone:'お気に入りをすべて回りました 🎉',tourSkip:'行けないため除外：',tourHelp:'✓を押すと訪問済みにして、そのブースから再計算します',tourBack:'← 目的地選択に戻る',web:'🔎 ウェブで検索',toDark:'🌙 ダーク',toLight:'☀ ライト',addBtn:'📲 ホームに追加',addTitle:'ホーム画面に追加',close:'閉じる',
  addIosH:'iPhone / iPad（Safari）',addIos:['Safariでこのページを開きます','画面下（iPadは上）の共有ボタン ⬆︎ をタップします','「ホーム画面に追加」をタップし、「追加」をタップします'],
  addAndH:'Android（Chrome）',addAnd:['Chromeでこのページを開きます','右上の ⋮ メニューをタップします','「アプリをインストール」または「ホーム画面に追加」をタップし、「インストール」をタップします'],
  addNote:'最初の1回はインターネットに接続した状態で開いてください。その後はオフラインでも開けます。',noRes:'該当するブースがありません',fuzzy:'近い結果（表記ゆれを許容）',webQ:'ウェブで検索：'}
};
let lang=(navigator.language||'').toLowerCase().startsWith('ja')?'ja':'ko';
try{const v=localStorage.getItem('expoLang');if(v==='ko'||v==='ja')lang=v}catch(e){}
const t=k=>I18N[lang][k];
const nm=d=>d.t||(d.f?t(d.f):'');
const byN=Object.fromEntries(DATA.map(d=>[d.n,d]));
let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('expoFavs')||'[]'))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('expoFavs',JSON.stringify([...favs]))}catch(e){}};
let visited=new Set(),memos={};
try{visited=new Set(JSON.parse(localStorage.getItem('expoVisited')||'[]'));memos=JSON.parse(localStorage.getItem('expoMemos')||'{}')}catch(e){}
const saveLS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let shutN='';  // 선택된 부스의 설명을 다시 눌러 접어 둔 번호
let hall='ALL',flt='',sel=null,q='';  // hall: 홀 필터 / flt: ''|'★'|'✓' (홀 필터와 함께 적용)

// ---- 정규화 (전각→반각, 소문자)
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); // 전각→반각, 소문자, 가타카나→히라가나
const compact=s=>norm(s).replace(/[\s\-_.·・,/&'’"()（）]+/g,''); // 띄어쓰기·기호 무시
DATA.forEach(d=>{d.key=norm(d.n+' '+d.t+' '+d.s.join(' ')+' '+d.g);d.ck=compact(d.n+d.t+d.s.join('')+d.g);d.tk=compact(d.t)});
// 오타 허용: 검색어와 편집거리 1 이하로 닮은 부분 문자열이 있는가 (Sellers)
function approx(p,txt){const m=p.length;if(m<4)return false;let prev=Array.from({length:m+1},(_,i)=>i);
  for(const ch of txt){const cur=[0];for(let i=1;i<=m;i++)cur[i]=Math.min(prev[i]+1,cur[i-1]+1,prev[i-1]+(p[i-1]===ch?0:1));if(cur[m]<=1)return true;prev=cur}return false}
const webUrl=d=>'https://www.google.com/search?q='+encodeURIComponent(d.t||'');

// ---- 지도 pan/zoom
const wrap=$('#mapwrap'),stage=$('#stage');
let sc=1,tx=0,ty=0;
const MAXS=3;
function fitScale(){return Math.min(wrap.clientWidth/MW,wrap.clientHeight/MH)}
function apply(){
  const f=fitScale();sc=Math.max(f*.9,Math.min(MAXS,sc));
  stage.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  stage.style.setProperty('--inv',1/sc);
  $('#ring').style.transform=`scale(${0.8/sc})`;
  $('#tip').style.transform=`scale(${1/sc})`;
  $('#me').style.transform=`scale(${0.7/sc})`;
  $('#rl0').style.strokeWidth=9/sc;$('#rl1').style.strokeWidth=5/sc;
}
function reset(){sc=fitScale();tx=(wrap.clientWidth-MW*sc)/2;ty=(wrap.clientHeight-MH*sc)/2;apply()}
function zoomAt(px,py,k){const ns=Math.max(fitScale()*.9,Math.min(MAXS,sc*k));k=ns/sc;tx=px-(px-tx)*k;ty=py-(py-ty)*k;sc=ns;apply()}
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15)},{passive:false});
const ptrs=new Map();let moved=0,pinch0=0;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('#ctl,#bar'))return;wrap.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;wrap.classList.add('drag');
  if(ptrs.size==2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1])}});
wrap.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size==1){tx+=e.clientX-p[0];ty+=e.clientY-p[1];moved+=Math.abs(e.clientX-p[0])+Math.abs(e.clientY-p[1]);apply()}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size==2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const r=wrap.getBoundingClientRect();
    zoomAt((a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,d/pinch0);pinch0=d;moved+=10}});
const up=e=>{

  if(e.type==='pointerup'&&ptrs.size===1&&moved<6){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const h=el&&el.closest('.hit');
    if(h)select(h.dataset.n,{scroll:true,zoom:false});

function scrollToItem(n){
  const L=$('#list'),li=L.querySelector(`.item[data-n="${n}"]`);if(!li)return;
  const lr=L.getBoundingClientRect(),ir=li.getBoundingClientRect();
  if(ir.top>=lr.top&&ir.bottom<=lr.bottom&&ir.top-lr.top<lr.height*.6)return; // 이미 잘 보이면 그대로

}

// ================= 길찾기 =================
const NAV=/*NAV*/null;
const CS=NAV.cs,GW=NAV.gw,GH=NAV.gh;
const grid=new Uint8Array(GW*GH);
{const bin=atob(NAV.b64);for(let i=0;i<GW*GH;i++)grid[i]=(bin.charCodeAt(i>>3)>>(7-(i&7)))&1}
// 벽에서 얼마나 떨어져 있는지 (통로 가운데로 길이 나게)
const dist=new Uint8Array(GW*GH);
for(let i=0;i<grid.length;i++)dist[i]=grid[i]?255:0;
for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;if(!dist[i])continue;let m=dist[i];
  if(x>0)m=Math.min(m,dist[i-1]+1);if(y>0){m=Math.min(m,dist[i-GW]+1);if(x>0)m=Math.min(m,dist[i-GW-1]+1);if(x<GW-1)m=Math.min(m,dist[i-GW+1]+1)}dist[i]=Math.min(m,255)}
for(let y=GH-1;y>=0;y--)for(let x=GW-1;x>=0;x--){const i=y*GW+x;if(!dist[i])continue;let m=dist[i];
  if(x<GW-1)m=Math.min(m,dist[i+1]+1);if(y<GH-1){m=Math.min(m,dist[i+GW]+1);if(x<GW-1)m=Math.min(m,dist[i+GW+1]+1);if(x>0)m=Math.min(m,dist[i+GW-1]+1)}dist[i]=Math.min(m,255)}

function nearestWalk(px,py){
  const cx=Math.floor(px/CS),cy=Math.floor(py/CS);let best=-1,bd=1e9;
  for(let r=0;r<80;r++){
    for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){
      if(Math.max(Math.abs(x-cx),Math.abs(y-cy))!==r||x<0||y<0||x>=GW||y>=GH)continue;
      if(!grid[y*GW+x])continue;const d=(x-cx)**2+(y-cy)**2;if(d<bd){bd=d;best=y*GW+x}}
    if(best>=0&&r>=Math.sqrt(bd)+1)break;
  }
  return best;
}
class Heap{constructor(){this.k=[];this.v=[]}get size(){return this.k.length}
  push(key,val){const k=this.k,v=this.v;let i=k.length;k.push(key);v.push(val);while(i>0){const p=(i-1)>>1;if(k[p]<=k[i])break;[k[p],k[i]]=[k[i],k[p]];[v[p],v[i]]=[v[i],v[p]];i=p}}
  pop(){const k=this.k,v=this.v,top=v[0],lk=k.pop(),lv=v.pop();if(k.length){k[0]=lk;v[0]=lv;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<k.length&&k[l]<k[m])m=l;if(r<k.length&&k[r]<k[m])m=r;if(m===i)break;[k[m],k[i]]=[k[i],k[m]];[v[m],v[i]]=[v[i],v[m]];i=m}}return top}}
// t 지정: A*(한 목적지). targets(Set) 지정: 다익스트라(여러 목적지 거리를 한 번에)
function search(s,t,targets){
  const N=GW*GH,g=new Float32Array(N).fill(1e9),par=new Int32Array(N).fill(-1),done=new Uint8Array(N),H=new Heap();
  const remain=targets?new Set(targets):null;
  const tx_=t==null?0:t%GW,ty_=t==null?0:(t/GW)|0;
  const h=t==null?()=>0:i=>{const dx=Math.abs((i%GW)-tx_),dy=Math.abs(((i/GW)|0)-ty_);return Math.max(dx,dy)+0.414*Math.min(dx,dy)};
  g[s]=0;H.push(h(s),s);
  while(H.size){
    const u=H.pop();if(done[u])continue;done[u]=1;
    if(t!=null&&u===t)break;
    if(remain){remain.delete(u);if(!remain.size)break}
    const ux=u%GW,uy=(u/GW)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;const x=ux+dx,y=uy+dy;if(x<0||y<0||x>=GW||y>=GH)continue;
      const v=y*GW+x;if(!grid[v]||done[v])continue;
      if(dx&&dy&&(!grid[uy*GW+x]||!grid[y*GW+ux]))continue; // 모서리 파고들기 금지
      const w=(dx&&dy?1.414:1)*(1+0.8*Math.max(0,4-dist[v]));
      const ng=g[u]+w;if(ng<g[v]){g[v]=ng;par[v]=u;H.push(ng+h(v),v)}
    }
  }
  return {g,par};
}
const pathTo=(par,t)=>{const p=[];for(let i=t;i!==-1;i=par[i])p.push(i);return p.reverse()};
function astar(s,t){const r=search(s,t);return r.g[t]>=1e9?null:pathTo(r.par,t)}
function los(a,b){
  const ax=a%GW,ay=(a/GW)|0,bx=b%GW,by=(b/GW)|0,n=Math.max(Math.abs(bx-ax),Math.abs(by-ay));
  for(let i=1;i<n;i++){const x=Math.round(ax+(bx-ax)*i/n),y=Math.round(ay+(by-ay)*i/n);if(dist[y*GW+x]<2)return false}
  return true;
}
function smooth(p){
  const out=[p[0]];let i=0;
  while(i<p.length-1){let j=p.length-1;while(j>i+1&&!los(p[i],p[j]))j--;out.push(p[j]);i=j}
  return out;
}

// navMode: 0=꺼짐, 1=출발지 선택 대기, 2=도착지 선택 대기, 3=경로 표시 중, 4=즐겨찾기 순회
let me=null,navMode=0;
function setNav(m){navMode=m;if(m<2)me=null;if(m===0||m===1){clearRoute()}if(m!==4)clearTour();updateMe();updateBar();
  $('#navbtn').classList.toggle('on',m>0);$('#navbtn').textContent=m>0?t('navEnd'):t('nav')}
$('#navbtn').onclick=()=>{if(navMode){setNav(0)}else{const keep=sel;setNav(1);if(keep)select(null);}};
function updateMe(){const m=$('#me');if(!me){m.style.display='none';return}const d=byN[me];m.style.display='block';m.style.left=d.x+'px';m.style.top=d.y+'px'}
function clearRoute(){$('#rl0').setAttribute('points','');$('#rl1').setAttribute('points','');routeState=''}
let routeState='';
function updateRoute(){
  if(navMode===4)return;
  clearRoute();
  if(navMode!==3||!me||!sel||me===sel)return;
  const a=byN[me],b=byN[sel],s=nearestWalk(a.x,a.y),t=nearestWalk(b.x,b.y);
  const raw=s>=0&&t>=0?astar(s,t):null;
  if(!raw){routeState='fail';return}
  const pts=[[a.x,a.y],...smooth(raw).map(i=>[(i%GW)*CS+CS/2,((i/GW)|0)*CS+CS/2]),[b.x,b.y]];
  const str=pts.map(p=>p.join(',')).join(' ');
  $('#rl0').setAttribute('points',str);$('#rl1').setAttribute('points',str);
  routeState='ok';
  // 경로 전체가 보이도록 화면 맞춤
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),pad=90;
  const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  sc=Math.min(1.1,wrap.clientWidth/(x1-x0),wrap.clientHeight/(y1-y0));
  tx=wrap.clientWidth/2-(x0+x1)/2*sc;ty=wrap.clientHeight/2-(y0+y1)/2*sc;apply();
}
function updateBar(){document.body.classList.toggle('navm',navMode>0);
  const p=$('#navpanel'),hint=$('#hint');
  if(!navMode){p.style.display='none';hint.style.display='';return}
  hint.style.display='none';p.style.display='block';
  const end=navMode===3?sel:null;
  const slot=(kind,n,active)=>{const d=n&&byN[n];
    return `<button class="slot${active?' act':''}" data-a="${kind}"><small>${t(kind==='s'?'start':'end')}</small>${d?`<b>${d.n}</b><span>${esc(nm(d))}</span>`:`<span class="ph">${active?t('pick'):'-'}</span>`}</button>`};
  if(navMode===4){
    const doneN=[...favs].filter(id=>visited.has(id)).length;
    let h=`<div class="ntitle">${t('tourTitle')(tourOrder.length)}</div><div class="nslots">${slot('s',tourStart,false)}</div>`;
    if(!tourOrder.length)h+=`<div class="nhelp">${t('tourAllDone')}</div>`;
    else h+=`<div class="tlist">`+tourOrder.map((id,i)=>`<div class="tstop" data-stop="${id}"><span class="tn">${i+1}</span><span class="tt"><b>${id}</b> ${esc(nm(byN[id]))}</span><button class="chk" data-vis="${id}">✓</button></div>`).join('')+`</div>`;
    if(tourSkipped.length)h+=`<div class="nhelp">${t('tourSkip')}${tourSkipped.join(', ')}</div>`;
    if(doneN)h+=`<div class="nhelp">${t('tourDone')(doneN)}</div>`;
    h+=`<div class="nhelp">${t('tourHelp')}</div><button class="nbtn ghost" data-a="back">${t('tourBack')}</button>`;
    p.innerHTML=h;return;
  }
  const title=navMode===1?t('t1'):navMode===2?t('t2'):(routeState==='ok'?t('t3'):t('tfail'));
  const cand=[...favs].filter(id=>id!==me&&!visited.has(id)&&byN[id]).length;
  p.innerHTML=`<div class="ntitle">${title}</div><div class="nslots">${slot('s',me,navMode===1)}<span class="arr">→</span>${slot('e',end,navMode===2)}</div>`
    +`<div class="nhelp">${navMode<3?t('h12'):t('h3')}</div>`
    +(navMode>=2&&cand?`<button class="nbtn ghost" data-a="tour">${t('tourBtn')(cand)}</button>`:'');
}
$('#navpanel').addEventListener('click',e=>{
  const v=e.target.closest('[data-vis]');if(v){toggleVisit(v.dataset.vis);return}
  const st=e.target.closest('[data-stop]');if(st){select(st.dataset.stop,{zoom:true});return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='tour')startTour();
  else if(a==='back'){clearTour();clearRoute();navMode=2;updateBar();select(null)}
  else if(a==='s'){setNav(1);select(null)}
  else if(a==='e'&&navMode===3)select(null);
});

// ---- 즐겨찾기 순회 동선 (가장 가까운 곳부터 + 2-opt 로 다듬기)
let tourStart=null,tourOrder=[],tourSkipped=[];
function clearTour(){tourOrder=[];tourSkipped=[];$('#stops').innerHTML=''}
function startTour(){tourStart=me;navMode=4;select(null);planTour();updateBar();$('#navbtn').classList.add('on');$('#navbtn').textContent=t('navEnd')}
function replanTour(){planTour();updateBar()}
function fitPts(pts,maxS){
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),pad=90;
  const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  sc=Math.min(maxS,wrap.clientWidth/(x1-x0),wrap.clientHeight/(y1-y0));
  tx=wrap.clientWidth/2-(x0+x1)/2*sc;ty=wrap.clientHeight/2-(y0+y1)/2*sc;apply();
}
function planTour(){
  clearRoute();clearTour();me=tourStart;updateMe();
  const ids=[...favs].filter(id=>id!==tourStart&&!visited.has(id)&&byN[id]).slice(0,30);
  if(!ids.length)return;
  const nodes=[tourStart,...ids],cells=nodes.map(id=>nearestWalk(byN[id].x,byN[id].y)),n=nodes.length;
  const D=nodes.map(()=>new Float64Array(n).fill(1e9));
  for(let i=0;i<n;i++){
    const r=search(cells[i],null,new Set(cells.filter((_,j)=>j!==i)));
    for(let j=0;j<n;j++)if(j!==i)D[i][j]=r.g[cells[j]];
  }
  const ok=[];for(let j=1;j<n;j++){if(D[0][j]<1e9)ok.push(j);else tourSkipped.push(nodes[j])}
  const order=[0],left=new Set(ok);let cur=0;
  while(left.size){let b=-1,bd=Infinity;for(const j of left)if(D[cur][j]<bd){bd=D[cur][j];b=j}order.push(b);left.delete(b);cur=b}
  for(let guard=0,imp=true;imp&&guard<50;guard++){imp=false;
    for(let i=1;i<order.length-1;i++)for(let k=i+1;k<order.length;k++){
      const a=order[i-1],b=order[i],c=order[k],d=k+1<order.length?order[k+1]:null;
      const delta=D[a][c]+(d!=null?D[b][d]:0)-D[a][b]-(d!=null?D[c][d]:0);
      if(delta<-1e-6){order.splice(i,k-i+1,...order.slice(i,k+1).reverse());imp=true}
    }}
  tourOrder=order.slice(1).map(j=>nodes[j]);
  const pts=[[byN[tourStart].x,byN[tourStart].y]];let prev=cells[0];
  for(let idx=1;idx<order.length;idx++){
    const j=order[idx],raw=astar(prev,cells[j]),sm=raw?smooth(raw):[prev,cells[j]];
    pts.push(...sm.map(i=>[(i%GW)*CS+CS/2,((i/GW)|0)*CS+CS/2]),[byN[nodes[j]].x,byN[nodes[j]].y]);prev=cells[j];
  }
  const str=pts.map(p=>p.join(',')).join(' ');
  $('#rl0').setAttribute('points',str);$('#rl1').setAttribute('points',str);routeState='ok';
  $('#stops').innerHTML=tourOrder.map((id,i)=>`<div class="stopn" style="left:${byN[id].x}px;top:${byN[id].y}px">${i+1}</div>`).join('');
  fitPts(pts,1.1);
}
updateMe();
reset();applyLang();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
