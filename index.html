<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EXPO MAP">
<title>AICHI SKY EXPO 부스 검색 지도</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#e2e4e8;--txt:#1d2024;--sub:#6b7280;--acc:#e8590c;--hit:rgba(232,89,12,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#15171a;--panel:#1e2125;--line:#33373d;--txt:#e8eaed;--sub:#9aa0a8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans",sans-serif}
#app{display:grid;grid-template-columns:360px 1fr;height:100%}
#side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
#top{padding:12px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--txt)}
#chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--txt);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#count{color:var(--sub);font-size:12px;margin-top:6px}
#list{flex:1;overflow:auto;min-height:0}
.item{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.item:hover{background:var(--bg)}
.item.sel{background:var(--hit)}
.num{flex:none;min-width:42px;text-align:center;font-weight:700;border-radius:6px;padding:1px 0;color:#fff;font-size:13px}
.H-C{background:#c9a227}.H-D{background:#5d8a3a}.H-E{background:#2a9d8f}.H-F{background:#5b7fb5}
.nm{flex:1;min-width:0}
.nm b{font-weight:600;word-break:break-word}
.nm small{display:block;color:var(--sub);font-size:12px;word-break:break-word}
.star{flex:none;border:0;background:none;font-size:18px;color:var(--line);cursor:pointer;padding:0 2px}
.star.on{color:#f5b301}
#mapwrap{position:relative;overflow:hidden;touch-action:none;background:#fff;cursor:grab}
#mapwrap.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;width:2000px;height:1269px;transform-origin:0 0}
#stage img{display:block;width:2000px;height:1269px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hit{position:absolute;width:30px;height:20px;margin:-10px 0 0 -15px;border-radius:4px;cursor:pointer}
.hit:hover{background:var(--hit);outline:1px solid var(--acc)}
.hit.fav::after{content:"★";position:absolute;right:-4px;top:-9px;color:#f5b301;font-size:12px;text-shadow:0 0 2px #000}
#ring{position:absolute;pointer-events:none;display:none;width:60px;height:60px;margin:-30px 0 0 -30px;border:4px solid var(--acc);border-radius:50%;animation:pulse 1.1s infinite;transform-origin:center}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,89,12,.6)}100%{box-shadow:0 0 0 30px rgba(232,89,12,0)}}
#tip{position:absolute;display:none;transform-origin:0 100%;background:#1d2024;color:#fff;padding:6px 10px;border-radius:8px;max-width:280px;font-size:14px;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#tip b{color:#ffb380}
#ctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#ctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:20px;cursor:pointer}
#hint{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:8px;font-size:12px}
@media(max-width:800px){
 html,body{height:100dvh}
 #app{grid-template-columns:1fr;grid-template-rows:46dvh 1fr;height:100dvh}
 .item{padding:12px}
 .star{font-size:24px;padding:0 6px}
 #ctl button{width:44px;height:44px}
 #mapwrap{order:-1;border-bottom:1px solid var(--line)}
 #side{border-right:0}
 #hint{display:none}
}
</style>
</head>

const $=s=>document.querySelector(s);
const byN=Object.fromEntries(DATA.map(d=>[d.n,d]));
let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('expoFavs')||'[]'))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('expoFavs',JSON.stringify([...favs]))}catch(e){}};
let hall='ALL',sel=null,q='';

// ---- 정규화 (전각→반각, 소문자)
const norm=s=>s.normalize('NFKC').toLowerCase();
DATA.forEach(d=>d.key=norm(d.n+' '+d.t+' '+d.s.join(' ')+' '+d.g));

// ---- 지도 pan/zoom
const wrap=$('#mapwrap'),stage=$('#stage');
let sc=1,tx=0,ty=0;
const MAXS=3;
function fitScale(){return Math.min(wrap.clientWidth/2000,wrap.clientHeight/1269)}
function apply(){
  const f=fitScale();sc=Math.max(f*.9,Math.min(MAXS,sc));
  stage.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  stage.style.setProperty('--inv',1/sc);
  $('#ring').style.transform=`scale(${1/sc*Math.max(1,Math.min(2.2,1/sc))})`;
  $('#tip').style.transform=`scale(${1/sc})`;
}
function reset(){sc=fitScale();tx=(wrap.clientWidth-2000*sc)/2;ty=(wrap.clientHeight-1269*sc)/2;apply()}
function zoomAt(px,py,k){const ns=Math.max(fitScale()*.9,Math.min(MAXS,sc*k));k=ns/sc;tx=px-(px-tx)*k;ty=py-(py-ty)*k;sc=ns;apply()}
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15)},{passive:false});
const ptrs=new Map();let moved=0,pinch0=0;
wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;wrap.classList.add('drag');
  if(ptrs.size==2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1])}});
wrap.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size==1){tx+=e.clientX-p[0];ty+=e.clientY-p[1];moved+=Math.abs(e.clientX-p[0])+Math.abs(e.clientY-p[1]);apply()}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size==2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const r=wrap.getBoundingClientRect();
    zoomAt((a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,d/pinch0);pinch0=d;moved+=10}});
const up=e=>{ptrs.delete(e.pointerId);wrap.classList.remove('drag')};
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
$('#zi').onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1.4);
$('#zo').onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1/1.4);
$('#zr').onclick=()=>{saved=null;select(null);reset()};
$('#cl').onclick=()=>select(null);
addEventListener('keydown',e=>{if(e.key==='Escape')select(null)});
wrap.addEventListener('click',e=>{if(!e.target.closest('.hit,#ctl')&&moved<6)select(null)});
addEventListener('resize',()=>{if(!sel)reset();else apply()});

// ---- 지도 히트영역
const hits={};
DATA.forEach(d=>{const h=document.createElement('div');h.className='hit';h.style.left=d.x+'px';h.style.top=d.y+'px';
  h.onclick=()=>{if(moved<6)select(d.n,{scroll:true,zoom:false})};hits[d.n]=h;stage.appendChild(h)});

let saved=null; // 선택 전 화면 상태 (해제 시 복원)
function select(n,o={}){
  if(n&&!sel&&!saved)saved={sc,tx,ty};
  sel=n;const ring=$('#ring'),tip=$('#tip');
  document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));
  if(!n){ring.style.display=tip.style.display='none';
    if(saved){({sc,tx,ty}=saved);saved=null;apply()}return}
  const d=byN[n];
  ring.style.display='block';ring.style.left=d.x+'px';ring.style.top=d.y+'px';
  tip.style.display='block';tip.style.left=(d.x+14)+'px';tip.style.top=(d.y-14)+'px';tip.style.transformOrigin='0 100%';
  tip.innerHTML=`<b>${d.n}</b> ${esc(d.t)}`+(d.s.length?`<br><span style="opacity:.75;font-size:12px">${esc(d.s.slice(0,3).join(' '))}${d.s.length>3?' …':''}</span>`:'');
  const li=document.querySelector(`.item[data-n="${n}"]`);if(li){li.classList.add('sel');if(o.scroll)li.scrollIntoView({block:'nearest'})}
  if(o.zoom!==false){const target=Math.max(sc,Math.max(fitScale()*1.3,1.1));sc=Math.min(MAXS,Math.min(target,Math.max(sc,1.1)));tx=wrap.clientWidth/2-d.x*sc;ty=wrap.clientHeight/2-d.y*sc}
  else{ // 화면 밖이면 중앙으로
    const px=d.x*sc+tx,py=d.y*sc+ty;if(px<40||py<40||px>wrap.clientWidth-40||py>wrap.clientHeight-40){tx=wrap.clientWidth/2-d.x*sc;ty=wrap.clientHeight/2-d.y*sc}}
  apply();
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- 목록
function render(){
  const terms=norm(q).split(/\s+/).filter(Boolean);
  const rows=DATA.filter(d=>(hall==='ALL'||(hall==='★'?favs.has(d.n):d.h===hall))&&terms.every(t=>d.key.includes(t)));
  $('#count').textContent=`${rows.length}개 부스`+(hall==='★'?' (즐겨찾기)':'');
  $('#list').innerHTML=rows.map(d=>`<div class="item${sel===d.n?' sel':''}" data-n="${d.n}"><span class="num H-${d.h}">${d.n}</span><div class="nm"><b>${esc(d.t)}</b>${d.s.length?`<small>${esc(d.s.join(' '))}</small>`:''}${d.g?`<small>[${esc(d.g)}]</small>`:''}</div><button class="star${favs.has(d.n)?' on':''}" data-s="${d.n}">★</button></div>`).join('');
  DATA.forEach(d=>hits[d.n].classList.toggle('fav',favs.has(d.n)));
}
$('#list').addEventListener('click',e=>{
  const s=e.target.closest('[data-s]');
  if(s){const n=s.dataset.s;favs.has(n)?favs.delete(n):favs.add(n);saveFavs();render();return}
  const it=e.target.closest('.item');if(it)select(it.dataset.n,{zoom:true});
});
$('#q').addEventListener('input',e=>{q=e.target.value;
  if(q.trim()&&hall!=='ALL'){hall='ALL';document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.h==='ALL'))}
  render();
  const t=norm(q).trim();if(/^\d{3}$/.test(t)&&byN[t])select(t,{zoom:true})});
$('#chips').innerHTML=['ALL','C','D','E','F','★'].map(h=>`<button class="chip${h==='ALL'?' on':''}" data-h="${h}">${h==='ALL'?'전체':h==='★'?'★ 즐겨찾기':'홀 '+h}</button>`).join('');
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;hall=b.dataset.h;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render()});
reset();render();
</script>
